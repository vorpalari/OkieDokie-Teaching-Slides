<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>OkieDokie Slide Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --cream:#f7f4ee;
  --ink:#33344a;
  --ink-soft:#6b6c85;
  --navy:#3a5ea7;
  --navy-dark:#2c4676;
  --pink:#ffe1ec;
  --pink-deep:#e8799f;
  --purple:#eadcff;
  --purple-deep:#8a5fd6;
  --green:#dbf3e2;
  --green-deep:#4f9c6b;
  --blue-bg:#dde8fb;
  --card-border:#e6e1f3;
  --shadow:0 8px 22px rgba(58,94,167,.10);
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  background-image:radial-gradient(circle at 8% 10%, rgba(255,220,234,.35) 0%, transparent 38%),
                    radial-gradient(circle at 94% 88%, rgba(220,243,227,.4) 0%, transparent 40%),
                    radial-gradient(circle at 90% 8%, rgba(232,239,250,.5) 0%, transparent 35%);
  color:var(--ink);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
input,textarea{user-select:text;-webkit-user-select:text;}
button{font-family:'Nunito',sans-serif;-webkit-appearance:none;appearance:none;cursor:pointer;border:none;background:none;}
h1,h2,h3{margin:0;font-family:'Fredoka One',sans-serif;font-weight:400;}
svg{display:block;}
.app-shell{max-width:1100px;margin:0 auto;padding:20px 22px 60px;}

/* ---------- top bar ---------- */
.top-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:46px;width:auto;display:block;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text .app-name{font-family:'Fredoka One',sans-serif;font-size:19px;color:var(--navy-dark);}
.brand-text .app-sub{font-size:11.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.3px;}
.search-wrap{flex:1;min-width:220px;position:relative;}
.search-wrap input{
  width:100%;padding:11px 16px 11px 40px;border-radius:20px;border:2px solid var(--card-border);
  background:#fff;font-size:14px;font-weight:700;color:var(--ink);
}
.search-wrap input:focus{outline:none;border-color:var(--navy);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4;color:var(--ink-soft);}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:14px;
  box-shadow:var(--shadow);border:2px solid var(--card-border);max-height:340px;overflow:auto;z-index:60;display:none;
}
.search-results.show{display:block;}
.search-result-item{padding:10px 16px;border-bottom:1px solid #f1eef8;font-size:13.5px;font-weight:700;}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:var(--blue-bg);}
.search-result-item .srtag{font-size:10.5px;color:var(--ink-soft);font-weight:800;display:block;margin-bottom:2px;letter-spacing:.3px;}
.search-empty{padding:16px;font-size:13px;color:var(--ink-soft);font-weight:700;text-align:center;}

/* ---------- utility bar (backup/restore) ---------- */
.utility-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.utility-hint{color:var(--ink-soft);font-weight:700;font-size:11.5px;line-height:1.4;}

/* ---------- pill tabs ---------- */
.tab-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.pill{
  padding:9px 18px;border-radius:20px;font-weight:800;font-size:13.5px;background:#fff;
  border:2px solid var(--card-border);color:var(--ink-soft);
}
.pill.subject-pill{font-family:'Fredoka One',sans-serif;font-size:14px;}
.pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.pill.add-pill{background:var(--blue-bg);border-style:dashed;color:var(--navy);}
.pill.level-pill.active{background:var(--purple-deep);border-color:var(--purple-deep);color:#fff;}
.pill.level-chip{padding:7px 14px;font-size:12.5px;}
.pill.level-chip.selected{background:var(--purple-deep);border-color:var(--purple-deep);color:#fff;}

/* ---------- layout: always stacked, full width ---------- */
.workspace{display:flex;flex-direction:column;gap:18px;margin-top:16px;}

.topics-card{background:#fff;border-radius:var(--radius);border:2px solid var(--card-border);padding:16px 18px;box-shadow:var(--shadow);}
.topics-card h3{font-size:12.5px;color:var(--ink-soft);letter-spacing:.4px;margin-bottom:12px;font-family:'Nunito',sans-serif;font-weight:800;text-transform:uppercase;}
.topic-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.topic-pill{
  display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:16px;
  font-weight:800;font-size:13.5px;color:var(--ink);background:var(--cream);border:2px solid transparent;
}
.topic-pill.active{background:var(--navy);color:#fff;}
.topic-pill .tname{pointer-events:none;}
.topic-pill .tcount{font-size:11px;font-weight:700;opacity:.65;pointer-events:none;}
.topic-pill .ticon{opacity:.55;width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.topic-pill .ticon:hover{opacity:1;background:rgba(0,0,0,.08);}
.topic-pill.active .ticon{opacity:.85;}
.topic-pill.active .ticon:hover{background:rgba(255,255,255,.2);}
.topic-pill .ticons-wrap{display:flex;align-items:center;gap:2px;}
.empty-note{font-size:12.5px;color:var(--ink-soft);font-weight:700;line-height:1.5;margin-bottom:12px;}
.add-topic-block{border-top:2px solid var(--cream);padding-top:14px;}
.add-topic-row{display:flex;gap:8px;margin-bottom:10px;}
.add-topic-row input{flex:1;padding:10px 12px;border-radius:10px;border:2px solid var(--card-border);font-size:13.5px;font-weight:700;min-width:0;}
.add-topic-row button{background:var(--green-deep);color:#fff;border-radius:10px;padding:0 16px;font-weight:800;font-size:13px;}
.level-select-label{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:7px;display:block;letter-spacing:.2px;}
.level-select-row{display:flex;gap:6px;flex-wrap:wrap;}

.main-panel{min-height:200px;}
.main-panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.main-panel-header h2{font-size:22px;color:var(--navy-dark);}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{padding:10px 18px;border-radius:14px;font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-dark);}
.btn-primary:disabled{opacity:.4;}
.btn-outline{background:#fff;border:2px solid var(--card-border);color:var(--ink);}
.btn-outline:hover{border-color:var(--navy);color:var(--navy);}
.btn-soft{background:var(--blue-bg);color:var(--navy-dark);}
.btn-danger{background:var(--pink-deep);color:#fff;}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.print-hint{font-size:11px;color:var(--ink-soft);font-weight:700;}

.slide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
.slide-card{background:#fff;border-radius:var(--radius);border:2px solid var(--card-border);box-shadow:var(--shadow);overflow:hidden;position:relative;}
.slide-card .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:5;}
.slide-card .card-actions-left{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:6px;z-index:5;}
.icon-btn.order-btn{color:var(--navy);}
.icon-btn:disabled{opacity:.3;pointer-events:none;}
.icon-btn{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.icon-btn.edit-btn{color:var(--navy);}
.icon-btn.print-btn{color:var(--green-deep);}
.icon-btn.del-btn{color:var(--pink-deep);}
.slide-card .slide-canvas{cursor:pointer;}
.slide-card .card-foot{padding:8px 12px 10px;font-size:11.5px;color:var(--ink-soft);font-weight:700;display:flex;justify-content:space-between;}

.page-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;}
.page-controls button{width:36px;height:36px;border-radius:10px;background:#fff;border:2px solid var(--card-border);color:var(--ink);display:flex;align-items:center;justify-content:center;}
.page-controls button:disabled{opacity:.3;}
.page-controls span{font-size:12.5px;font-weight:800;color:var(--ink-soft);}

.big-empty{background:#fff;border:2px dashed var(--card-border);border-radius:var(--radius);padding:44px 20px;text-align:center;color:var(--ink-soft);font-weight:700;}
.big-empty .eb-icon{display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--ink-soft);opacity:.6;}

/* ---------- slide canvas + template (no scroll: everything clips like a real slide) ---------- */
.slide-canvas{
  position:relative;aspect-ratio:4/3;width:100%;container-type:inline-size;
  border-radius:var(--radius);overflow:hidden;
}
.theme-blue{--bg:var(--blue-bg);--accent:var(--navy);}
.theme-pink{--bg:var(--pink);--accent:var(--pink-deep);}
.theme-purple{--bg:var(--purple);--accent:var(--purple-deep);}
.theme-green{--bg:var(--green);--accent:var(--green-deep);}

.slide-inner{position:absolute;inset:0;background:var(--bg);padding:6cqw;display:flex;flex-direction:column;overflow:hidden;}
.slide-inner.title-slide{justify-content:center;}
.deco-circle{position:absolute;border-radius:50%;background:var(--accent);opacity:.14;pointer-events:none;z-index:1;}
.deco-circle.c1{width:22cqw;height:22cqw;top:-8cqw;right:-6cqw;}
.deco-circle.c2{width:10cqw;height:10cqw;bottom:4cqw;left:-4cqw;opacity:.16;}
.deco-star{position:absolute;color:var(--accent);opacity:.4;z-index:1;pointer-events:none;}
.deco-star.s1{width:7cqw;height:7cqw;top:5cqw;right:9cqw;}
.deco-star.s2{width:4.2cqw;height:4.2cqw;bottom:8cqw;right:5cqw;opacity:.3;}
.brand-stamp{position:absolute;bottom:2.6cqw;right:4cqw;font-size:1.9cqw;font-weight:800;color:var(--ink-soft);opacity:.5;z-index:3;letter-spacing:.02em;}

.hero-card{position:relative;z-index:2;background:#fff;border-radius:4cqw;padding:4.4cqw 5.2cqw;box-shadow:0 1.4cqw 2.8cqw rgba(35,25,55,.08);flex-shrink:0;}
.hero-card .eyebrow{font-size:2.3cqw;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:1.2cqw;}
.hero-card h1{font-size:8cqw;color:var(--ink);line-height:1.12;}
.hero-card .subtitle{font-size:3cqw;font-weight:700;color:var(--ink-soft);margin-top:1.6cqw;line-height:1.4;}

.compact-header{position:relative;z-index:2;flex-shrink:0;margin-bottom:3.4cqw;}
.compact-header .eyebrow{font-size:2.1cqw;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:1.2cqw;opacity:.85;}
.type-badge{display:inline-block;background:var(--accent);color:#fff;font-family:'Fredoka One',sans-serif;font-size:2.3cqw;padding:.9cqw 2.8cqw;border-radius:20px;margin-bottom:1.4cqw;}
.compact-header h2{font-size:5cqw;color:var(--ink);line-height:1.16;}

.content-zone{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:2.2cqw;overflow:hidden;min-height:0;}
.card-block{background:#fff;border-radius:3cqw;padding:3.6cqw 4.2cqw;box-shadow:0 1cqw 2cqw rgba(35,25,55,.06);border-left:.9cqw solid var(--accent);flex:1;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.card-block .card-text{font-size:3.4cqw;font-weight:700;line-height:1.5;color:var(--ink);white-space:pre-wrap;}

.examples-row{display:flex;flex-direction:column;gap:1.7cqw;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;}
.example-card{background:#fff;border-radius:2.6cqw;padding:2.3cqw 3cqw;display:flex;gap:2.2cqw;align-items:center;box-shadow:0 .8cqw 1.6cqw rgba(35,25,55,.05);flex-shrink:0;}
.example-num{font-family:'Fredoka One',sans-serif;background:var(--accent);color:#fff;width:6cqw;height:6cqw;min-width:6cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.9cqw;}
.example-text{font-size:3.1cqw;font-weight:700;color:var(--ink);line-height:1.35;white-space:pre-wrap;}

/* image and text template */
.imgtext-row{display:flex;gap:3cqw;flex:1;min-height:0;overflow:hidden;}
.imgtext-row img{width:44%;height:100%;object-fit:cover;border-radius:3cqw;box-shadow:0 1cqw 2cqw rgba(35,25,55,.08);}
.imgtext-noimg{width:44%;height:100%;border-radius:3cqw;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2.5cqw;color:var(--ink-soft);font-weight:700;text-align:center;padding:2cqw;box-shadow:0 1cqw 2cqw rgba(35,25,55,.06);}
.imgtext-row .card-block{flex:1;}

/* list template */
.bullet-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.8cqw;overflow:hidden;}
.bullet-list li{display:flex;gap:2.2cqw;align-items:flex-start;font-size:3.3cqw;font-weight:700;line-height:1.4;color:var(--ink);}
.bullet-list li .dot{width:2.6cqw;height:2.6cqw;min-width:2.6cqw;border-radius:50%;background:var(--accent);margin-top:1cqw;}

/* word list / chips */
.chips-row{display:flex;flex-wrap:wrap;gap:2cqw;flex:1;align-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.chip-pill{background:#fff;border:.35cqw solid var(--accent);color:var(--accent);border-radius:1.8cqw;padding:1.8cqw 3.4cqw;font-size:3.2cqw;font-weight:800;box-shadow:0 .6cqw 1.2cqw rgba(35,25,55,.05);}

.examples-row::-webkit-scrollbar,.card-block::-webkit-scrollbar,.chips-row::-webkit-scrollbar{width:8px;}
.examples-row::-webkit-scrollbar-thumb,.card-block::-webkit-scrollbar-thumb,.chips-row::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:8px;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(35,25,55,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 20px 50px rgba(30,20,50,.25);}
.modal-box.wide{max-width:780px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:19px;color:var(--navy-dark);}
.modal-close{width:32px;height:32px;border-radius:10px;background:var(--cream);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;}
.modal-close:hover{color:var(--ink);}

.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.2px;}
.form-field input[type=text]{
  width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--card-border);font-size:14px;
  font-family:'Nunito',sans-serif;font-weight:700;color:var(--ink);
}
.form-field input[type=text]:focus{outline:none;border-color:var(--navy);}
.form-field .hint{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:5px;}
.theme-picker{display:flex;gap:8px;}
.theme-swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;}
.theme-swatch.blue{background:var(--navy);}
.theme-swatch.pink{background:var(--pink-deep);}
.theme-swatch.purple{background:var(--purple-deep);}
.theme-swatch.green{background:var(--green-deep);}
.theme-swatch.selected{border-color:var(--ink);}
.img-upload-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.img-upload-row img{width:90px;height:66px;object-fit:cover;border-radius:10px;border:2px solid var(--card-border);}
.editor-preview{margin-bottom:18px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;position:sticky;bottom:-26px;background:#fff;padding-top:12px;}
.modal-foot.spread{justify-content:space-between;}

.confirm-text{font-size:14.5px;font-weight:700;line-height:1.5;color:var(--ink);margin-bottom:20px;}
.confirm-foot{display:flex;justify-content:flex-end;gap:10px;}

/* ---------- rich text fields ---------- */
.rich-field{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--card-border);font-size:14px;font-family:'Nunito',sans-serif;font-weight:700;color:var(--ink);white-space:pre-wrap;min-height:70px;outline:none;}
.rich-field:focus{border-color:var(--navy);}
.rich-field:empty:before{content:attr(data-placeholder);color:#a3a3b5;font-weight:600;}
.rich-field.item-field{min-height:44px;flex:1;}
.item-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.item-row{display:flex;gap:8px;align-items:flex-start;}
.item-del{width:36px;height:36px;flex-shrink:0;border-radius:10px;background:var(--cream);color:var(--pink-deep);display:flex;align-items:center;justify-content:center;}
.item-del:hover{background:var(--pink);}
.chip-input-row{display:flex;gap:8px;margin-bottom:10px;}
.chip-input-row input{flex:1;padding:10px 12px;border-radius:10px;border:2px solid var(--card-border);font-size:13.5px;font-weight:700;min-width:0;}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip-tag{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border-radius:10px;padding:6px 6px 6px 12px;font-size:12.5px;font-weight:800;color:var(--ink);}
.chip-remove{width:18px;height:18px;border-radius:6px;background:rgba(0,0,0,.06);color:var(--ink-soft);font-size:13px;display:flex;align-items:center;justify-content:center;}
.chip-remove:hover{background:var(--pink);color:var(--pink-deep);}

/* floating format toolbar, appears near selected text */
.floating-toolbar{position:fixed;display:none;align-items:center;gap:6px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(20,15,30,.25);padding:7px 8px;z-index:3000;border:2px solid var(--card-border);}
.ft-swatch{width:26px;height:26px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 2px var(--card-border);}
.ft-swatch:hover{box-shadow:0 0 0 2px var(--ink-soft);}
.ft-btn{width:28px;height:28px;border-radius:8px;background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center;}
.ft-btn:hover{background:var(--blue-bg);}
.ft-clear{width:auto;padding:0 10px;font-size:11px;font-weight:800;color:var(--ink-soft);background:var(--cream);border-radius:8px;}

/* ---------- add slides modal ---------- */
.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px;}
.type-card{border:2px solid var(--card-border);border-radius:14px;padding:14px;text-align:left;background:#fff;}
.type-card.selected{border-color:var(--navy);background:var(--blue-bg);}
.type-card .tc-top{display:flex;align-items:center;gap:8px;color:var(--navy);font-family:'Fredoka One',sans-serif;font-size:14px;margin-bottom:5px;}
.type-card .tc-top span{flex:1;}
.type-card .tc-desc{font-size:11.5px;font-weight:700;color:var(--ink-soft);line-height:1.4;}
.type-card .tc-check{width:18px;height:18px;border-radius:6px;border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.type-card.selected .tc-check{background:var(--navy);border-color:var(--navy);}
.type-card .tc-stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;}
.tc-step-btn{width:28px;height:28px;border-radius:8px;background:var(--cream);color:var(--navy);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1;}
.tc-step-btn:hover{background:var(--blue-bg);}
.tc-count{font-weight:800;min-width:16px;text-align:center;color:var(--ink);}
.text-color-row{display:flex;gap:7px;margin-top:9px;}
.text-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;}
.text-swatch[data-active="1"]{border-color:var(--ink);box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--ink);}

/* ---------- full screen viewer ---------- */
.viewer-overlay{position:fixed;inset:0;background:rgba(20,15,32,.94);display:none;align-items:center;justify-content:center;gap:22px;z-index:2000;padding:30px;}
.viewer-overlay.show{display:flex;}
.viewer-slide-wrap{width:min(88vw, calc(82vh * 4 / 3));display:flex;flex-direction:column;gap:12px;align-items:center;}
.viewer-slide-wrap .slide-canvas{width:100%;aspect-ratio:4/3;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.viewer-counter{color:#fff;font-weight:800;font-size:13px;opacity:.65;}
.viewer-close{position:absolute;top:24px;right:26px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.viewer-close:hover{background:rgba(255,255,255,.22);}
.viewer-nav{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.viewer-nav:hover{background:rgba(255,255,255,.22);}
.viewer-nav:disabled{opacity:.2;cursor:default;}
.viewer-nav:disabled:hover{background:rgba(255,255,255,.12);}

/* ---------- loading + sync status ---------- */
.boot-loading{position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:5000;flex-direction:column;gap:14px;}
.boot-loading.hide{display:none;}
.boot-spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--card-border);border-top-color:var(--navy);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.boot-loading-text{font-weight:800;color:var(--ink-soft);font-size:13.5px;}
.sync-banner{display:none;align-items:center;justify-content:space-between;gap:14px;background:var(--pink);border:2px solid var(--pink-deep);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:12.5px;font-weight:700;line-height:1.4;}

/* ---------- print ---------- */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;}
  .print-page{width:100%;page-break-after:always;padding:0;}
  .print-page:last-child{page-break-after:auto;}
  .print-page .slide-canvas{aspect-ratio:4/3;width:100%;border-radius:0;}
  .print-page .examples-row,.print-page .card-block,.print-page .chips-row{overflow:visible;}
  @page{size:landscape;margin:10mm;}
}
</style>
</head>

/* ---------------- helpers ---------------- */
function escapeHtml(str){
  if(str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,"<br>"); }
function sanitizeRichHtml(html){
  if(!html) return "";
  var allowed = { SPAN:1, BR:1, DIV:1 };
  var holder = document.createElement("div");
  holder.innerHTML = html;
  (function clean(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(child){
      if(child.nodeType === 1){
        if(!allowed[child.tagName]){
          while(child.firstChild){ node.insertBefore(child.firstChild, child); }
          node.removeChild(child);
          return;
        }
        if(child.tagName === "DIV"){
          var br = document.createElement("br");
          node.insertBefore(br, child);
          while(child.firstChild){ node.insertBefore(child.firstChild, child); }
          node.removeChild(child);
          return;
        }
        var styleParts = [];
        if(child.style && child.style.color) styleParts.push("color:" + child.style.color);
        if(child.style && (child.style.fontWeight === "bold" || child.style.fontWeight === "700" || child.style.fontWeight === 700)) styleParts.push("font-weight:bold");
        var decoParts = [];
        if(child.style && child.style.textDecoration){
          if(child.style.textDecoration.indexOf("line-through") > -1) decoParts.push("line-through");
          if(child.style.textDecoration.indexOf("underline") > -1) decoParts.push("underline");
        }
        if(decoParts.length) styleParts.push("text-decoration:" + decoParts.join(" "));
        Array.prototype.slice.call(child.attributes).forEach(function(attr){ child.removeAttribute(attr.name); });
        if(styleParts.length) child.setAttribute("style", styleParts.join(";"));
        clean(child);
      }
    });
  })(holder);
  return holder.innerHTML;
}
function topicsFor(subjectId, level){
  return state.topics.filter(function(t){ return t.subjectId === subjectId && t.levels.indexOf(level) > -1; });
}
function slidesFor(topicId){
  return state.slides.filter(function(s){ return s.topicId === topicId; });
}
function moveSlide(id, dir){
  var slide = state.slides.filter(function(s){return s.id===id;})[0];
  if(!slide) return;
  var list = slidesFor(slide.topicId);
  var pos = list.findIndex(function(s){return s.id===id;});
  if(pos < 0) return;
  var swapPos = pos + dir;
  if(swapPos < 0 || swapPos >= list.length) return;
  var a = list[pos], b = list[swapPos];
  var ia = state.slides.indexOf(a), ib = state.slides.indexOf(b);
  state.slides[ia] = b;
  state.slides[ib] = a;
  saveState();
  renderMain();
}
function getTopic(id){ return state.topics.filter(function(t){return t.id===id;})[0]; }
function getSubject(id){ return state.subjects.filter(function(s){return s.id===id;})[0]; }

function fieldsForTemplate(t){
  switch(t){
    case "title": return ["title","subtitle","color"];
    case "tryitout": return ["title","tryItOut","color"];
    case "rule": return ["title","body","color"];
    case "examples": return ["title","examples","color"];
    case "wordlist": return ["title","chips","color"];
    case "imagetext": return ["title","image","caption","color"];
    case "list": return ["title","bullets","color"];
    default: return ["title","color"];
  }
}

function richField(key, index, placeholder, value, extraClass){
  var idxAttr = (index === undefined || index === null) ? "" : (' data-index="' + index + '"');
  var cls = "rich-field" + (extraClass ? (" " + extraClass) : "");
  return '<div class="' + cls + '" contenteditable="true" data-key="' + key + '"' + idxAttr +
    ' data-placeholder="' + escapeHtml(placeholder) + '">' + (value || "") + '</div>';
}

function itemListField(key, label, placeholder, addLabel){
  var arr = editorDraft[key] || [];
  var html = '<div class="form-field"><label>' + escapeHtml(label) + ' (optional)</label><div class="item-list">';
  arr.forEach(function(val, i){
    html += '<div class="item-row">' + richField(key, i, placeholder, val, "item-field") +
      '<button type="button" class="item-del" data-removeitem="' + key + '" data-index="' + i + '" title="Remove">' + icon("trash",13) + '</button></div>';
  });
  html += '</div><button type="button" class="btn btn-outline btn-sm" data-additem="' + key + '">' + icon("plusCircle",14) + ' ' + escapeHtml(addLabel) + '</button>' +
    '<div class="hint">Select text and use the toolbar that appears to colour or strike it. Enter makes a line break in the same box, use "' + escapeHtml(addLabel) + '" to start a new one.</div></div>';
  return html;
}

function renderEditorFields(){
  var wrap = document.getElementById("editorFields");
  var flds = fieldsForTemplate(editorDraft.template);
  var html = "";
  flds.forEach(function(f){
    if(f === "title"){
      html += '<div class="form-field"><label>Slide title</label>' +
        '<input type="text" id="f_title" value="' + escapeHtml(editorDraft.title) + '" placeholder="e.g. Adjectives that show feelings">' +
        '<div class="text-color-row" id="f_titlecolor">' +
        TITLE_COLORS.map(function(c){
          var active = (editorDraft.titleColor || "") === c.value;
          var bg = c.value ? ('background:' + c.value + ';') : 'background:#fff;border:2px dashed var(--card-border);';
          return '<button type="button" class="text-swatch" style="' + bg + '" data-titlecolor="' + c.value + '"' + (active ? ' data-active="1"' : '') + ' title="' + c.label + ' title colour"></button>';
        }).join("") +
        '</div><div class="hint">Colour of the title text</div></div>';
    } else if(f === "subtitle"){
      html += '<div class="form-field"><label>Subtitle (optional)</label>' +
        '<input type="text" id="f_subtitle" value="' + escapeHtml(editorDraft.subtitle) + '" placeholder="A short line under the title"></div>';
    } else if(f === "tryItOut"){
      html += '<div class="form-field"><label>Try it out</label>' + richField("tryItOut", null, "An exposure question", editorDraft.tryItOut) +
        '<div class="hint">Select text and use the toolbar that appears to colour or strike it</div></div>';
    } else if(f === "body"){
      html += '<div class="form-field"><label>Rule</label>' + richField("body", null, "Type the teaching point here", editorDraft.body) +
        '<div class="hint">Select text and use the toolbar that appears to colour or strike it</div></div>';
    } else if(f === "examples"){
      html += itemListField("examples", "Examples", "Type one example", "Add example");
    } else if(f === "chips"){
      html += renderChipsField();
    } else if(f === "caption"){
      html += '<div class="form-field"><label>Text</label>' + richField("caption", null, "Short explanation to go with the picture", editorDraft.caption) +
        '<div class="hint">Select text and use the toolbar that appears to colour or strike it</div></div>';
    } else if(f === "bullets"){
      html += itemListField("bullets", "Key points", "Type one point", "Add point");
    } else if(f === "image"){
      html += '<div class="form-field"><label>Image</label>' +
        '<div class="img-upload-row">' +
        (editorDraft.imageData ? '<img id="f_imgpreview" src="' + editorDraft.imageData + '">' : '<span class="hint" id="f_imgpreviewempty">No image chosen</span>') +
        '<input type="file" id="f_image" accept="image/*">' +
        (editorDraft.imageData ? '<button type="button" class="btn btn-outline" id="f_imgremove">Remove</button>' : '') +
        '</div></div>';
    } else if(f === "color"){
      html += '<div class="form-field"><label>Colour theme (slide background)</label><div class="theme-picker" id="f_colorpicker">' +
        THEMES.map(function(c){
          return '<button type="button" class="theme-swatch ' + c + (editorDraft.color===c?' selected':'') + '" data-color="' + c + '"></button>';
        }).join("") + '</div></div>';
    }
  });
  wrap.innerHTML = html;
  attachFieldListeners();
}

function renderChipsField(){
  var arr = editorDraft.chips || [];
  var html = '<div class="form-field"><label>Words to remember</label>' +
    '<div class="chip-input-row"><input type="text" id="f_chipinput" placeholder="Type a word, then press enter"><button type="button" class="btn btn-outline btn-sm" id="f_chipadd">Add</button></div>' +
    '<div class="chip-list">';
  arr.forEach(function(w,i){
    html += '<span class="chip-tag">' + escapeHtml(w) + '<button type="button" class="chip-remove" data-removechip="' + i + '">&times;</button></span>';
  });
  html += '</div></div>';
  return html;
}

function attachFieldListeners(){
  function bindText(id, key){
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("input", function(){
      editorDraft[key] = el.value;
      renderEditorPreview();
    });
  }
  bindText("f_title","title");
  bindText("f_subtitle","subtitle");

  var titleColorRow = document.getElementById("f_titlecolor");
  if(titleColorRow){
    titleColorRow.querySelectorAll(".text-swatch").forEach(function(sw){
      sw.addEventListener("click", function(){
        editorDraft.titleColor = sw.getAttribute("data-titlecolor");
        titleColorRow.querySelectorAll(".text-swatch").forEach(function(s){ s.removeAttribute("data-active"); });
        sw.setAttribute("data-active","1");
        renderEditorPreview();
      });
    });
  }

  var colorPicker = document.getElementById("f_colorpicker");
  if(colorPicker){
    colorPicker.querySelectorAll(".theme-swatch").forEach(function(sw){
      sw.addEventListener("click", function(){
        editorDraft.color = sw.getAttribute("data-color");
        colorPicker.querySelectorAll(".theme-swatch").forEach(function(s){s.classList.remove("selected");});
        sw.classList.add("selected");
        renderEditorPreview();
      });
    });
  }

  var imgInput = document.getElementById("f_image");
  if(imgInput){
    imgInput.addEventListener("change", function(){
      var file = imgInput.files[0];
      if(!file) return;
      if(file.size > 4*1024*1024){
        alert("That image is quite large. Please choose one under 4MB so it saves smoothly.");
        return;
      }
      var reader = new FileReader();
      reader.onload = function(){
        editorDraft.imageData = reader.result;
        renderEditorPreview();
        renderEditorFields();
      };
      reader.readAsDataURL(file);
    });
  }
  var imgRemove = document.getElementById("f_imgremove");
  if(imgRemove){
    imgRemove.addEventListener("click", function(){
      editorDraft.imageData = "";
      renderEditorPreview();
      renderEditorFields();
    });
  }

  var chipInput = document.getElementById("f_chipinput");
  if(chipInput){
    chipInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); addChip(); }
    });
  }
}

function addChip(){
  var input = document.getElementById("f_chipinput");
  if(!input) return;
  var val = input.value.trim();
  if(!val) return;
  editorDraft.chips = editorDraft.chips || [];
  editorDraft.chips.push(val);
  renderEditorFields();
  renderEditorPreview();
}

/* ---------- rich field behaviour: enter = line break within the box ---------- */
document.addEventListener("input", function(e){
  if(e.target.classList && e.target.classList.contains("rich-field")) syncRichField(e.target);
});
document.addEventListener("keydown", function(e){
  if(e.target.classList && e.target.classList.contains("rich-field") && e.key === "Enter"){
    e.preventDefault();
    insertBrAtCaret();
    syncRichField(e.target);
  }
});
function insertBrAtCaret(){
  var sel = window.getSelection();
  if(!sel.rangeCount) return;
  var range = sel.getRangeAt(0);
  range.deleteContents();
  var br = document.createElement("br");
  range.insertNode(br);
  range.setStartAfter(br);
  range.setEndAfter(br);
  sel.removeAllRanges();
  sel.addRange(range);
}
function syncRichField(el){
  var key = el.getAttribute("data-key");
  var idxAttr = el.getAttribute("data-index");
  if(idxAttr !== null){
    var arr = editorDraft[key] || (editorDraft[key] = []);
    arr[parseInt(idxAttr,10)] = el.innerHTML;
  } else {
    editorDraft[key] = el.innerHTML;
  }
  renderEditorPreview();
}
/* clean up leftover empty/duplicate style spans once the person leaves a text box.
   This is done on blur (not while typing) so the cursor is never disturbed mid-type.
   It fixes the "looks coloured while typing, plain on the slide" glitch caused by
   an empty coloured span being left behind after deleting text. */
function normalizeAndSyncRichField(el){
  var changed = true, guard = 0;
  while(changed && guard < 40){
    changed = false; guard++;
    var spans = Array.prototype.slice.call(el.querySelectorAll("span"));
    for(var i=0;i<spans.length;i++){
      var sp = spans[i];
      if(!sp.textContent && sp.querySelectorAll("br").length === 0){
        sp.remove();
        changed = true;
        break;
      }
    }
    if(changed) continue;
    var kids = Array.prototype.slice.call(el.childNodes);
    for(var j=0;j<kids.length-1;j++){
      var a = kids[j], b = kids[j+1];
      if(a && b && a.nodeType===1 && b.nodeType===1 && a.tagName==="SPAN" && b.tagName==="SPAN" &&
         (a.getAttribute("style")||"") === (b.getAttribute("style")||"")){
        while(b.firstChild){ a.appendChild(b.firstChild); }
        b.remove();
        changed = true;
        break;
      }
    }
  }
  syncRichField(el);
}
document.addEventListener("focusout", function(e){
  if(e.target.classList && e.target.classList.contains("rich-field")) normalizeAndSyncRichField(e.target);
});

/* ---------- floating format toolbar ---------- */
var activeRichField = null;
document.getElementById("ftStrikeBtn").innerHTML = icon("strike",14);
document.getElementById("ftBoldBtn").innerHTML = icon("bold",14);
document.getElementById("ftUnderlineBtn").innerHTML = icon("underline",14);

document.addEventListener("selectionchange", function(){
  var editorEl = document.getElementById("editorModal");
  if(!editorEl.classList.contains("show")){ hideFloatingToolbar(); return; }
  var sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed){ hideFloatingToolbar(); return; }
  var range = sel.getRangeAt(0);
  var node = sel.anchorNode;
  var el = node && node.nodeType === 3 ? node.parentElement : node;
  var richEl = el && el.closest ? el.closest(".rich-field") : null;
  if(!richEl){ hideFloatingToolbar(); return; }
  activeRichField = richEl;
  var rect = range.getBoundingClientRect();
  if(rect.width === 0 && rect.height === 0){ hideFloatingToolbar(); return; }
  positionFloatingToolbar(rect);
});
function positionFloatingToolbar(rect){
  var tb = document.getElementById("floatingToolbar");
  tb.style.display = "flex";
  var left = rect.left + rect.width/2 - 100;
  left = Math.max(8, Math.min(left, window.innerWidth - 208));
  var top = rect.top - 50;
  if(top < 8) top = rect.bottom + 10;
  tb.style.left = left + "px";
  tb.style.top = top + "px";
}
function hideFloatingToolbar(){
  var tb = document.getElementById("floatingToolbar");
  if(tb) tb.style.display = "none";
}
document.addEventListener("mousedown", function(e){
  if(e.target.closest(".floating-toolbar")){ e.preventDefault(); return; }
  if(!e.target.closest(".rich-field")) hideFloatingToolbar();
});
document.addEventListener("touchstart", function(e){
  if(e.target.closest(".floating-toolbar")) return;
  if(!e.target.closest(".rich-field")) hideFloatingToolbar();
}, { passive: true });
function applyFormatToSelection(styleObj){
  var sel = window.getSelection();
  if(!sel.rangeCount) return;
  var range = sel.getRangeAt(0);
  if(range.collapsed) return;
  if(!activeRichField || !activeRichField.contains(range.commonAncestorContainer)) return;
  var span = document.createElement("span");
  if(styleObj.color) span.style.color = styleObj.color;
  if(styleObj.textDecoration) span.style.textDecoration = styleObj.textDecoration;
  if(styleObj.fontWeight) span.style.fontWeight = styleObj.fontWeight;
  try{
    range.surroundContents(span);
  }catch(e){
    var contents = range.extractContents();
    span.appendChild(contents);
    range.insertNode(span);
  }
  sel.removeAllRanges();
  syncRichField(activeRichField);
  hideFloatingToolbar();
}

function isBlankRich(html){
  var d = document.createElement("div");
  d.innerHTML = html || "";
  return !d.textContent.trim();
}
function cleanBeforeSave(){
  if(editorDraft.body !== undefined) editorDraft.body = sanitizeRichHtml(editorDraft.body);
  if(editorDraft.tryItOut !== undefined) editorDraft.tryItOut = sanitizeRichHtml(editorDraft.tryItOut);
  if(editorDraft.caption !== undefined) editorDraft.caption = sanitizeRichHtml(editorDraft.caption);
  if(editorDraft.examples){
    editorDraft.examples = editorDraft.examples.map(sanitizeRichHtml).filter(function(v){ return !isBlankRich(v); });
  }
  if(editorDraft.bullets){
    editorDraft.bullets = editorDraft.bullets.map(sanitizeRichHtml).filter(function(v){ return !isBlankRich(v); });
  }
}

function saveEditorSlide(){
  if(!editorDraft.title || !editorDraft.title.trim()){
    alert("Please give this slide a title before saving.");
    return;
  }
  cleanBeforeSave();
  if(ui.editingSlideId){
    var idx = state.slides.findIndex(function(s){return s.id===ui.editingSlideId;});
    if(idx > -1){
      editorDraft.id = ui.editingSlideId;
      state.slides[idx] = editorDraft;
    }
  } else {
    editorDraft.id = uid("slide");
    state.slides.push(editorDraft);
  }
  saveState();
  closeModal("editorModal");
  renderMain();
}

/* ---------------- full screen viewer ---------------- */
var viewerSlides = [];
var viewerIndex = 0;
function openViewer(slideId){
  viewerSlides = slidesFor(ui.topicId);
  viewerIndex = viewerSlides.findIndex(function(s){return s.id===slideId;});
  if(viewerIndex < 0) viewerIndex = 0;
  renderViewer();
  document.getElementById("viewerOverlay").classList.add("show");
}
function renderViewer(){
  var sl = viewerSlides[viewerIndex];
  if(!sl) return;
  var topic = getTopic(ui.topicId);
  var canvas = document.getElementById("viewerCanvas");
  canvas.className = "slide-canvas theme-" + sl.color;
  canvas.innerHTML = renderSlideInner(sl, topic);
  document.getElementById("viewerCounter").textContent = (viewerIndex+1) + " / " + viewerSlides.length;
  document.getElementById("viewerPrev").disabled = viewerIndex <= 0;
  document.getElementById("viewerNext").disabled = viewerIndex >= viewerSlides.length - 1;
}
function closeViewer(){
  document.getElementById("viewerOverlay").classList.remove("show");
}
document.addEventListener("keydown", function(e){
  if(!document.getElementById("viewerOverlay").classList.contains("show")) return;
  if(e.key === "Escape"){ closeViewer(); }
  else if(e.key === "ArrowLeft" && viewerIndex > 0){ viewerIndex--; renderViewer(); }
  else if(e.key === "ArrowRight" && viewerIndex < viewerSlides.length - 1){ viewerIndex++; renderViewer(); }
});

/* ---------------- print ---------------- */
function printSlides(list, topic){
  var area = document.getElementById("printArea");
  var html = "";
  list.forEach(function(sl){
    html += '<div class="print-page"><div class="slide-canvas theme-' + sl.color + '">' + renderSlideInner(sl, topic) + '</div></div>';
  });
  area.innerHTML = html;
  window.print();
}
var savedTitle = document.title;
window.addEventListener("beforeprint", function(){ savedTitle = document.title; document.title = ""; });
window.addEventListener("afterprint", function(){ document.title = savedTitle; });

function askConfirm(message, onYes){
  document.getElementById("confirmText").textContent = message;
  ui.pendingDelete = onYes;
  openModal("confirmModal");
}

/* ---------------- topic editing ---------------- */
function openTopicEdit(topicId){
  var topic = getTopic(topicId);
  if(!topic) return;
  ui.editingTopicId = topicId;
  ui.editTopicLevels = topic.levels.slice();
  document.getElementById("editTopicName").value = topic.name;
  renderLevelChipRow("editTopicLevels", ui.editTopicLevels, "editlevel");
  openModal("topicEditModal");
}

/* ---------------- duplicate topic ---------------- */
function duplicateTopicPrompt(topicId){
  var topic = getTopic(topicId);
  if(!topic) return;
  var slides = slidesFor(topicId);
  if(!slides.length){ alert("This topic has no slides to duplicate yet."); return; }
  var name = prompt('Duplicate "' + topic.name + '" to which topic?\n\nType an EXISTING topic name to add the copies there, or type a NEW name to create a new topic.', topic.name + " copy");
  if(!name || !name.trim()) return;
  name = name.trim();
  var dest = state.topics.filter(function(t){ return t.subjectId === topic.subjectId && t.name.toLowerCase() === name.toLowerCase(); })[0];
  var isNew = !dest;
  if(!dest){
    dest = { id: uid("topic"), subjectId: topic.subjectId, levels: topic.levels.slice(), name: name };
    state.topics.push(dest);
  }
  slides.forEach(function(sl){
    var copy = JSON.parse(JSON.stringify(sl));
    copy.id = uid("slide");
    copy.topicId = dest.id;
    state.slides.push(copy);
  });
  saveState();
  ui.topicId = dest.id;
  ui.slidePage = 0;
  renderTopicPills();
  alert('Duplicated ' + slides.length + ' slide' + (slides.length===1?"":"s") + ' into "' + dest.name + '"' + (isNew ? " (new topic)." : "."));
}

/* ---------------- backup and restore ---------------- */
function downloadBackup(){
  var data = JSON.stringify(state, null, 2);
  var blob = new Blob([data], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "okiedokie-slide-studio-backup-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleRestoreFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert("That file could not be read. Please choose a Slide Studio backup file."); return; }
    if(!parsed || !parsed.subjects || !parsed.topics || !parsed.slides){
      alert("That does not look like a Slide Studio backup file.");
      return;
    }
    askConfirm("Restore this backup? It will replace everything currently in Slide Studio.", function(){
      state = parsed;
      normalizeState();
      ui.subjectId = state.subjects[0] ? state.subjects[0].id : null;
      ui.topicId = null;
      ui.slidePage = 0;
      saveState();
      renderSubjectTabs();
      renderLevelTabs();
      renderTopicPills();
    });
  };
  reader.readAsText(file);
}

/* ---------------- search ---------------- */
function runSearch(query){
  var box = document.getElementById("searchResults");
  query = query.trim().toLowerCase();
  if(!query){ box.classList.remove("show"); box.innerHTML=""; return; }
  var results = [];
  state.slides.forEach(function(sl){
    var topic = getTopic(sl.topicId);
    if(!topic) return;
    var subject = getSubject(topic.subjectId);
    var haystack = [sl.title, sl.body, sl.subtitle, sl.tryItOut, sl.caption, (sl.examples||[]).join(" "), (sl.bullets||[]).join(" "), (sl.chips||[]).join(" "), topic.name, subject?subject.name:""].join(" ").toLowerCase();
    if(haystack.indexOf(query) > -1){
      results.push({ slide: sl, topic: topic, subject: subject });
    }
  });
  if(!results.length){
    box.innerHTML = '<div class="search-empty">No slides found</div>';
  } else {
    box.innerHTML = results.slice(0,20).map(function(r){
      return '<div class="search-result-item" data-jump="' + r.slide.id + '" data-jumptopic="' + r.topic.id + '" data-jumpsub="' + r.subject.id + '" data-jumplevel="' + r.topic.levels[0] + '">' +
        '<span class="srtag">' + escapeHtml(r.subject.name) + ' &middot; ' + escapeHtml(levelLabel(r.topic.levels)) + ' &middot; ' + escapeHtml(r.topic.name) + '</span>' +
        escapeHtml(r.slide.title || "(untitled)") +
        '</div>';
    }).join("");
  }
  box.classList.add("show");
}

/* ---------------- event wiring ---------------- */
document.addEventListener("click", function(e){
  var t = e.target;

  var closeEl = t.closest("[data-close]");
  if(closeEl){
    closeModal(closeEl.getAttribute("data-close"));
    return;
  }
  if(t.classList.contains("modal-overlay")){
    t.classList.remove("show");
    return;
  }

  var swatchEl = t.closest(".ft-swatch, .ft-clear");
  if(swatchEl){
    var col = swatchEl.getAttribute("data-applycolor");
    applyFormatToSelection(col === "clear" ? { color:"var(--ink)", textDecoration:"none", fontWeight:"normal" } : { color: col });
    return;
  }
  if(t.closest("#ftStrikeBtn")){
    applyFormatToSelection({ textDecoration: "line-through" });
    return;
  }
  if(t.closest("#ftBoldBtn")){
    applyFormatToSelection({ fontWeight: "bold" });
    return;
  }
  if(t.closest("#ftUnderlineBtn")){
    applyFormatToSelection({ textDecoration: "underline" });
    return;
  }

  var subEl = t.closest("[data-subject]");
  if(subEl){
    ui.subjectId = subEl.getAttribute("data-subject");
    ui.topicId = null;
    ui.slidePage = 0;
    renderSubjectTabs();
    renderTopicPills();
    return;
  }
  if(t.id === "addSubjectBtn"){
    var name = prompt("New subject name");
    if(name && name.trim()){
      var sub = { id: uid("sub"), name: name.trim() };
      state.subjects.push(sub);
      ui.subjectId = sub.id;
      ui.topicId = null;
      ui.slidePage = 0;
      saveState();
      renderSubjectTabs();
      renderTopicPills();
    }
    return;
  }

  var lvlEl = t.closest("[data-level]");
  if(lvlEl){
    ui.level = lvlEl.getAttribute("data-level");
    ui.topicId = null;
    ui.slidePage = 0;
    renderLevelTabs();
    renderTopicPills();
    return;
  }

  var newLevelEl = t.closest("[data-newlevel]");
  if(newLevelEl){
    var nl = newLevelEl.getAttribute("data-newlevel");
    var pos = ui.newTopicLevels.indexOf(nl);
    if(pos > -1){ ui.newTopicLevels.splice(pos,1); } else { ui.newTopicLevels.push(nl); }
    renderLevelChipRow("newTopicLevels", ui.newTopicLevels, "newlevel");
    return;
  }
  var editLevelEl = t.closest("[data-editlevel]");
  if(editLevelEl){
    var el2 = editLevelEl.getAttribute("data-editlevel");
    var pos2 = ui.editTopicLevels.indexOf(el2);
    if(pos2 > -1){ ui.editTopicLevels.splice(pos2,1); } else { ui.editTopicLevels.push(el2); }
    renderLevelChipRow("editTopicLevels", ui.editTopicLevels, "editlevel");
    return;
  }

  var incEl = t.closest("[data-typeinc]");
  if(incEl){
    var ik = incEl.getAttribute("data-typeinc");
    ui.addSlidesSelection[ik] = (ui.addSlidesSelection[ik] || 0) + 1;
    renderTypeGrid();
    return;
  }
  var decEl = t.closest("[data-typedec]");
  if(decEl){
    var dk = decEl.getAttribute("data-typedec");
    ui.addSlidesSelection[dk] = Math.max(0, (ui.addSlidesSelection[dk] || 0) - 1);
    renderTypeGrid();
    return;
  }
  if(t.id === "useDefaultBtn"){ ui.addSlidesSelection = getDefaultTemplateCounts(); renderTypeGrid(); return; }
  if(t.id === "saveDefaultBtn"){
    state.defaultTemplate = Object.assign({}, ui.addSlidesSelection);
    saveState();
    alert("Saved. This mix will now be pre-filled whenever you use \"Use default template\".");
    return;
  }
  if(t.id === "clearAllBtn"){
    var cleared = {};
    TYPE_ORDER.forEach(function(k){ cleared[k] = 0; });
    ui.addSlidesSelection = cleared;
    renderTypeGrid();
    return;
  }
  if(t.id === "createSlidesBtn"){ createSlidesBatch(); return; }
  if(t.id === "addSlideBtn"){ openAddSlidesModal(); return; }

  if(t.id === "f_chipadd"){ addChip(); return; }
  var removeChipEl = t.closest("[data-removechip]");
  if(removeChipEl){
    var chipIdx = parseInt(removeChipEl.getAttribute("data-removechip"),10);
    editorDraft.chips.splice(chipIdx,1);
    renderEditorFields();
    renderEditorPreview();
    return;
  }
  var addItemEl = t.closest("[data-additem]");
  if(addItemEl){
    var addKey = addItemEl.getAttribute("data-additem");
    editorDraft[addKey] = editorDraft[addKey] || [];
    editorDraft[addKey].push("");
    renderEditorFields();
    renderEditorPreview();
    return;
  }
  var removeItemEl = t.closest("[data-removeitem]");
  if(removeItemEl){
    var remKey = removeItemEl.getAttribute("data-removeitem");
    var remIdx = parseInt(removeItemEl.getAttribute("data-index"),10);
    editorDraft[remKey].splice(remIdx,1);
    renderEditorFields();
    renderEditorPreview();
    return;
  }

  if(t.id === "viewerClose" || t.id === "viewerOverlay"){ closeViewer(); return; }
  if(t.id === "viewerPrev"){ if(viewerIndex > 0){ viewerIndex--; renderViewer(); } return; }
  if(t.id === "viewerNext"){ if(viewerIndex < viewerSlides.length - 1){ viewerIndex++; renderViewer(); } return; }
  var viewEl = t.closest("[data-view]");
  if(viewEl){ openViewer(viewEl.getAttribute("data-view")); return; }

  if(t.id === "pagePrevBtn"){ ui.slidePage--; renderMain(); return; }
  if(t.id === "pageNextBtn"){ ui.slidePage++; renderMain(); return; }

  var printOneEl = t.closest("[data-printone]");
  if(printOneEl){
    var pid = printOneEl.getAttribute("data-printone");
    var psl = state.slides.filter(function(s){return s.id===pid;})[0];
    if(psl) printSlides([psl], getTopic(psl.topicId));
    return;
  }

  var delSlideEl = t.closest("[data-delslide]");
  if(delSlideEl){
    var did = delSlideEl.getAttribute("data-delslide");
    askConfirm("Delete this slide? This cannot be undone.", function(){
      state.slides = state.slides.filter(function(s){return s.id!==did;});
      saveState();
      renderMain();
    });
    return;
  }

  var moveUpEl = t.closest("[data-moveup]");
  if(moveUpEl && !moveUpEl.disabled){
    moveSlide(moveUpEl.getAttribute("data-moveup"), -1);
    return;
  }
  var moveDownEl = t.closest("[data-movedown]");
  if(moveDownEl && !moveDownEl.disabled){
    moveSlide(moveDownEl.getAttribute("data-movedown"), 1);
    return;
  }

  var editEl = t.closest("[data-edit]");
  if(editEl){
    var sid = editEl.getAttribute("data-edit");
    var slide = state.slides.filter(function(s){return s.id===sid;})[0];
    if(slide) openEditorFor(slide.template, slide);
    return;
  }

  var editTopicEl = t.closest("[data-edittopic]");
  if(editTopicEl){
    openTopicEdit(editTopicEl.getAttribute("data-edittopic"));
    return;
  }

  var dupTopicEl = t.closest("[data-duptopic]");
  if(dupTopicEl){
    duplicateTopicPrompt(dupTopicEl.getAttribute("data-duptopic"));
    return;
  }

  var topicEl = t.closest("[data-topic]");
  if(topicEl){
    ui.topicId = topicEl.getAttribute("data-topic");
    ui.slidePage = 0;
    renderTopicPills();
    return;
  }

  if(t.id === "printTopicBtn"){
    var topic2 = getTopic(ui.topicId);
    var list = slidesFor(ui.topicId);
    if(list.length) printSlides(list, topic2);
    return;
  }

  if(t.id === "saveSlideBtn"){ saveEditorSlide(); return; }

  if(t.id === "saveTopicBtn"){
    var topic3 = getTopic(ui.editingTopicId);
    if(topic3){
      var newName = document.getElementById("editTopicName").value.trim();
      if(!newName){ alert("Please give the topic a name."); return; }
      if(!ui.editTopicLevels.length){ alert("Please tick at least one level."); return; }
      topic3.name = newName;
      topic3.levels = ui.editTopicLevels.slice();
      saveState();
      closeModal("topicEditModal");
      renderTopicPills();
    }
    return;
  }
  if(t.id === "deleteTopicBtn"){
    var tid2 = ui.editingTopicId;
    var topic4 = getTopic(tid2);
    var count2 = slidesFor(tid2).length;
    closeModal("topicEditModal");
    askConfirm('Delete the topic "' + (topic4?topic4.name:"") + '"? This will also delete ' + count2 + ' slide' + (count2===1?"":"s") + ' inside it. This cannot be undone.', function(){
      state.topics = state.topics.filter(function(x){return x.id!==tid2;});
      state.slides = state.slides.filter(function(x){return x.topicId!==tid2;});
      if(ui.topicId === tid2) ui.topicId = null;
      saveState();
      renderTopicPills();
    });
    return;
  }

  if(t.id === "confirmYesBtn"){
    if(typeof ui.pendingDelete === "function") ui.pendingDelete();
    ui.pendingDelete = null;
    closeModal("confirmModal");
    return;
  }

  if(t.id === "backupBtn"){ downloadBackup(); return; }
  if(t.id === "restoreBtn"){ document.getElementById("restoreFileInput").click(); return; }
  if(t.id === "syncRetryBtn"){ boot(); return; }

  var jumpEl = t.closest("[data-jump]");
  if(jumpEl){
    ui.subjectId = jumpEl.getAttribute("data-jumpsub");
    ui.level = jumpEl.getAttribute("data-jumplevel");
    ui.topicId = jumpEl.getAttribute("data-jumptopic");
    ui.slidePage = 0;
    renderSubjectTabs();
    renderLevelTabs();
    renderTopicPills();
    document.getElementById("searchResults").classList.remove("show");
    document.getElementById("searchInput").value = "";
    return;
  }

  if(!t.closest(".search-wrap")){
    document.getElementById("searchResults").classList.remove("show");
  }
});

document.getElementById("addTopicBtn").addEventListener("click", addTopicHandler);
document.getElementById("newTopicInput").addEventListener("keydown", function(e){
  if(e.key === "Enter") addTopicHandler();
});
function addTopicHandler(){
  var input = document.getElementById("newTopicInput");
  var name = input.value.trim();
  if(!name) return;
  if(!ui.subjectId){ alert("Please choose a subject first."); return; }
  if(!ui.newTopicLevels.length){ alert("Please tick at least one level this topic suits."); return; }
  var topic = { id: uid("topic"), subjectId: ui.subjectId, levels: ui.newTopicLevels.slice(), name: name };
  state.topics.push(topic);
  ui.topicId = topic.id;
  ui.slidePage = 0;
  input.value = "";
  saveState();
  renderTopicPills();
}

document.getElementById("searchInput").addEventListener("input", function(e){
  runSearch(e.target.value);
});

document.getElementById("restoreFileInput").addEventListener("change", function(e){
  var f = e.target.files[0];
  if(f) handleRestoreFile(f);
  e.target.value = "";
});

/* ---------------- init ---------------- */
boot();

})();
</script>
</body>
</html>
